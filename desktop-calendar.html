<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日历工坊 · 电脑壁纸</title><style>

r:#355a40}.tabs{display:flex;background:#f3f5f1;padding:3px;border-radius:8px;margin-bottom:10px}.tabs button{flex:1;border:0;border-radius:6px;background:none;padding:7px 2px;font-size:12px;color:#889087}.tabs button.active{background:white;color:#334e3b;box-shadow:0 1px 4px #00000009}.custom{display:flex;gap:8px;align-items:center}.custom label{font-size:11px;color:#879084}.palette{display:flex;gap:9px}.swatch{width:40px;height:40px;border:3px solid white;outline:1px solid #e4e8e0;border-radius:50%}.swatch.active{outline:2px solid #6f8b70}.link{border:0;background:none;color:#6c8270;font-size:11px;padding:0}.colors{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:12px;color:#758075}input[type=color]{width:30px;height:29px;padding:2px;border:1px solid #e0e5df;border-radius:6px;background:white;cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;margin:13px 0;font-size:12px;color:#69766a}.switch{appearance:none;width:31px;height:18px;background:#d9ded7;border-radius:20px;position:relative;cursor:pointer}.switch:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:white}.switch:checked{background:#65826b}.switch:checked:before{left:15px}input[type=range]{width:135px;accent-color:#68806a}.download{width:100%;background:#426750;color:white;border:0;border-radius:9px;padding:13px;font-weight:500}.hint{font-size:10px;color:#a0a69e;text-align:center;line-height:1.7;margin:9px 0 0}main{padding:32px 42px;min-width:0;display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;align-items:center}.preview-head h1{font-size:16px;font-weight:500;margin:0 0 7px}.preview-head p{font-size:11px;color:#929a91;margin:0}.random{display:flex;gap:7px;align-items:center;border:1px solid #dfe5db;background:#fff;border-radius:9px;padding:10px 14px;color:#596e5a;font-size:12px}.random svg{width:16px;height:16px}.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:390px;padding:32px 0}.frame{width:100%;filter:drop-shadow(0 16px 24px #28352212)}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 270px);object-fit:contain;border-radius:4px}.foot{display:flex;justify-content:space-between;color:#98a093;font-size:11px;padding:0 0 12px}#status{min-height:18px;color:#687c6a;font-size:12px;text-align:center}[hidden]{display:none!important}@media(max-width:950px){main{padding:25px}.app{grid-template-columns:280px 1fr}aside{padding:20px}.stage{min-height:270px}}@media(max-width:680px){header{padding:0 20px}.app{display:flex;flex-direction:column}main{order:-1}.stage{min-height:0;padding:25px 0}canvas{max-height:none}aside{border:0}.layouts{grid-template-columns:repeat(6,1fr)}.tag{display:none}}

/* Neutral surfaces and restrained blue accents keep the wallpaper in focus. */
:root{--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--accent:#0071e3}body{background:#f5f5f7;-webkit-font-smoothing:antialiased}header{height:76px;background:rgba(255,255,255,.88);border-color:#dedee3;padding:0 32px}.logo{background:#1d1d1f;color:white;border-radius:13px;padding:8px 12px}.brand strong{font-size:18px;letter-spacing:-.5px}.brand small{font-size:9px;color:#86868b;letter-spacing:2.2px}.tag{border:0;background:#f5f5f7;color:#6e6e73;padding:9px 15px}.app{grid-template-columns:340px minmax(0,1fr);height:calc(100dvh - 76px);min-height:0}aside{background:#f5f5f7;border-color:#e1e1e6;padding:20px;overflow-y:auto;scrollbar-width:thin}section{background:#fff;border:1px solid #ebebef;border-radius:18px;padding:17px;margin:0 0 13px;box-shadow:0 2px 5px #00000002}h2{font-size:12px;letter-spacing:.1px;margin-bottom:13px}.month,input[type=number],select{background:#f5f5f7;border:1px solid #e9e9ed;border-radius:9px}.month button{color:#1d1d1f}.layout{color:#6e6e73;border:1px solid transparent;background:#f5f5f7;border-radius:10px;padding:11px 2px}.layout.active{background:#edf5ff;color:#0066cc;border-color:#80b8f0}.layout:hover{border-color:#b6cce2}.tabs{background:#eeeef0;border-radius:9px;padding:3px}.tabs button{padding:7px 3px;color:#6e6e73;border-radius:7px}.tabs button.active{color:#1d1d1f;box-shadow:0 1px 4px #00000017}.palette{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px 8px;margin:15px 0}.swatch{width:100%;height:auto;border:0;outline:0!important;border-radius:10px;background:none;padding:0;color:#6e6e73;font-size:10px;line-height:1.4}.swatch .sample{display:block;height:39px;border-radius:10px;border:1px solid #00000009;margin-bottom:6px;position:relative}.swatch.active .sample{outline:2px solid #0071e3;outline-offset:2px}.swatch.active{color:#0066cc}.swatch.active .sample:after{content:'✓';position:absolute;right:4px;bottom:3px;background:#fff;color:#0066cc;width:15px;height:15px;line-height:15px;border-radius:50%;font-size:10px;box-shadow:0 1px 3px #0002}.link{color:#0071e3;font-size:11px}.colors{border-top:1px solid #f0f0f3;padding-top:13px;color:#6e6e73}.row{color:#515154}.switch{background:#d2d2d7}.switch:checked{background:#007aff}input[type=range]{accent-color:#007aff}input[type=color]{border-color:#dddde2;border-radius:8px;width:29px}.download{background:#0071e3;border-radius:12px;box-shadow:0 4px 12px #0071e318}.download:hover{background:#0077ed}.download:disabled{opacity:.5;cursor:wait}.hint{color:#86868b}.micro{line-height:1.5;color:#86868b}.custom label{color:#6e6e73}main{padding:30px 40px;overflow:auto;background:#f5f5f7}.preview-head h1{font-size:21px;letter-spacing:-.5px;font-weight:600}.preview-head p{font-size:12px;color:#86868b;margin-top:9px}.random{border:1px solid #e2e2e7;color:#1d1d1f;box-shadow:0 2px 5px #00000004;border-radius:20px;padding:10px 16px}.stage{min-height:240px}.frame{filter:drop-shadow(0 18px 24px #00000012)}canvas{border-radius:12px;max-height:calc(100dvh - 270px)}.foot{color:#86868b}#status{color:#6e6e73}button:focus-visible,input:focus-visible,select:focus-visible{outline-color:#007aff}.direction-label{font-size:11px;color:#6e6e73;display:block;margin:15px 0 8px}#direction .tabs{margin:0}.download-area{padding:3px 2px 6px}@media(max-width:1050px){.app{grid-template-columns:310px minmax(0,1fr)}main{padding:26px}aside{padding:15px}section{padding:14px}}@media(max-width:680px){.app{height:auto;display:flex}main{overflow:visible}aside{overflow:visible;padding:18px}.layouts{grid-template-columns:repeat(3,1fr)}canvas{max-height:none}header{padding:0 20px}.stage{min-height:0}section{padding:18px}}
</style></head><body>
<header><div class="brand"><span class="logo">▦</span><div><strong>日历工坊</strong><small>DESKTOP CALENDAR</small></div></div><span class="tag">给桌面一点秩序，也一点留白</span></header>
<div class="app"><aside>
<section><h2>日期设置</h2><div class="date"><input id="year" type="number" min="1901" max="2099" aria-label="年份"><div class="month"><button id="prev" aria-label="上个月">‹</button><span id="monthLabel"></span><button id="next" aria-label="下个月">›</button></div></div></section>
<section><h2>版式选择</h2><div class="layouts" id="layouts"></div></section>
<section><h2>壁纸尺寸</h2><div class="tabs" id="devices"><button data-device="mac" class="active">Mac</button><button data-device="windows">Windows</button><button data-device="custom">自定义</button></div><select id="sizes" aria-label="壁纸尺寸"></select><div id="custom" class="custom" hidden><label>宽<input id="width" type="number" min="640" max="7680" value="2560"></label><span>×</span><label>高<input id="height" type="number" min="480" max="4320" value="1600"></label></div><div class="micro" id="sizeHint" style="margin-top:8px">按原始分辨率导出 PNG</div></section>
<section><div class="section-head"><h2>配色方案</h2><button class="link" id="randomColor">↻ 随机配色</button></div><div class="tabs" id="background"><button data-bg="solid">纯色</button><button data-bg="gradient" class="active">渐变</button></div><div class="palette" id="palette"></div><div id="direction"><span class="direction-label">渐变方向</span><div class="tabs"><button data-direction="vertical" class="active">↓ 上下渐变</button><button data-direction="horizontal">→ 左右渐变</button></div></div><div class="colors"><span>背景</span><input type="color" id="color1" aria-label="背景起始色"><input type="color" id="color2" aria-label="背景结束色"><span style="margin-left:auto">文字</span><input type="color" id="textColor" aria-label="日历文字颜色"></div></section>
<section><h2>其他设置</h2><label class="row">周一作为每周开始<input type="checkbox" id="monday" class="switch" checked></label><label class="row">显示农历<input type="checkbox" id="lunar" class="switch" checked></label><label class="row">日历行距<input type="range" id="spacing" min="85" max="120" value="100" aria-label="日历行距"></label></section>
<button class="download" id="download">↓ &nbsp;下载壁纸 PNG</button><p class="hint">无需登录 · 本地生成 · 原尺寸高清导出</p>
</aside><main><div class="preview-head"><div><h1>壁纸预览</h1><p>每一次打开电脑，都从从容容。</p></div><button class="random" id="random" title="随机搭配背景与日历版式" aria-label="随机搭配背景与日历版式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="9" r="1"/></svg>随机</button></div><div class="stage"><div class="frame"><canvas id="canvas" aria-label="日历壁纸实时预览"></canvas></div></div><div class="foot"><span id="description"></span><span id="resolution"></span></div><div id="status" role="status" aria-live="polite"></div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id), now=new Date();
const state={year:now.getFullYear(),month:now.getMonth(),layout:0,device:'mac',w:2560,h:1600,bg:'gradient',direction:'vertical',c1:'#cddcf5',c2:'#ede0ef',text:'#30374f',monday:true,lunar:true,spacing:1};
const names=['经典居中','左侧日历','右侧日历','超大数字','横向时间轴','全年日历'];
const months=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
// Trend-inspired screen palettes; these are custom RGB interpretations, not official swatches.
const paletteSets={
solid:[['云朵白','#f2f1ed','#f2f1ed','#343536'],['深青绿','#245b57','#245b57','#f3f6ec'],['果冻薄荷','#c7ebd8','#c7ebd8','#254b40'],['空气蓝','#cddcf5','#cddcf5','#2f405f'],['奶油黄','#f4e7b5','#f4e7b5','#554b2b'],['雾玫瑰','#e7cbd4','#e7cbd4','#533740'],['可可棕','#665047','#665047','#fff3e8'],['石墨黑','#282a30','#282a30','#f4f4f7']],
gradient:[['蓝调暮光','#cddcf5','#ede0ef','#30374f'],['薄荷晨雾','#c7ebd8','#e9f0dd','#274b41'],['香草日光','#f4e7b5','#f0d6c7','#584333'],['玫瑰柔光','#ebc7d6','#e3d9f3','#52354b'],['海盐冰蓝','#d2eff0','#b8cbef','#2c4560'],['杏色落日','#f4cfb8','#e4bed1','#5b3846'],['深海青绿','#153d40','#38756c','#f2f6e9'],['靛蓝夜幕','#202a52','#4a416d','#f5f0ff']]
};
function currentPalettes(){return paletteSets[state.bg]}
function drawPalettes(){const axis=state.direction==='vertical'?'to bottom':'to right';$('palette').innerHTML=currentPalettes().map((p,i)=>`<button class="swatch" data-palette="${i}" aria-label="${p[0]}配色" title="${p[0]}"><span class="sample" style="background:${state.bg==='solid'?p[1]:`linear-gradient(${axis},${p[1]},${p[2]})`}"></span>${p[0]}</button>`).join('');}

const sizes={mac:[[2560,1600],[2880,1800],[3024,1964],[3456,2234],[4480,2520],[5120,2880]],windows:[[1920,1080],[2560,1440],[3840,2160],[3440,1440]]};
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let lunarFormat;try{lunarFormat=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{month:'long',day:'numeric',timeZone:'Asia/Shanghai'});if(lunarFormat.resolvedOptions().calendar!=='chinese')throw Error();}catch(e){state.lunar=false;$('lunar').checked=false;$('lunar').disabled=true;$('status').textContent='当前浏览器不支持农历，请使用新版 Chrome、Edge 或 Safari。';}
const lunarCache=new Map();
function lunar(y,m,d){const key=`${y}-${m}-${d}`;if(lunarCache.has(key))return lunarCache.get(key);const parts=lunarFormat.formatToParts(new Date(Date.UTC(y,m,d,4)));const day=Number(parts.find(x=>x.type==='day').value);const nums=['一','二','三','四','五','六','七','八','九','十'];const result=day===1?parts.find(x=>x.type==='month').value:day<11?'初'+nums[day-1]:day<20?'十'+nums[day-11]:day===20?'二十':day<30?'廿'+nums[day-21]:'三十';lunarCache.set(key,result);return result;}
function text(t,x,y,size,weight=400,alpha=1,align='center'){ctx.globalAlpha=alpha;ctx.fillStyle=state.text;ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y);ctx.globalAlpha=1;}
function days(y,m){return new Date(y,m+1,0).getDate()}
function grid(m,x,y,w,h,mini=false){const cell=w/7,row=h/7*state.spacing;const font=Math.min(cell*.31,row*(state.lunar?.48:.60));const labels=state.monday?['一','二','三','四','五','六','日']:['日','一','二','三','四','五','六'];labels.forEach((v,i)=>text(v,x+cell*(i+.5),y,font*.68,400,.55));const offset=(new Date(state.year,m,1).getDay()+(state.monday?6:0))%7;for(let d=1;d<=days(state.year,m);d++){const n=offset+d-1,c=n%7,r=Math.floor(n/7);const dx=x+cell*(c+.5),dy=y+row*(r+1);text(d,dx,dy,font,400,.95);if(state.lunar)text(lunar(state.year,m,d),dx,dy+font*.89,font*.42,400,.63);}}
function render(){canvas.width=state.w;canvas.height=state.h;const W=state.w,H=state.h;let bg=state.c1;if(state.bg==='gradient'){bg=ctx.createLinearGradient(0,0,state.direction==='horizontal'?W:0,state.direction==='vertical'?H:0);bg.addColorStop(0,state.c1);bg.addColorStop(1,state.c2)}ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const U=Math.min(W/1.6,H);if(state.layout===5){text(state.year,W*.07,H*.105,U*.062,500,1,'left');text('A YEAR OF POSSIBILITIES',W*.93,H*.105,U*.013,400,.55,'right');const cols=W/H<1.2?3:4,rows=12/cols,cw=W*.86/cols,ch=H*.76/rows;for(let m=0;m<12;m++){const x=W*.07+(m%cols)*cw,y=H*.20+Math.floor(m/cols)*ch;text(`${String(m+1).padStart(2,'0')}  ${months[m]}`,x+cw*.07,y,Math.min(cw*.062,ch*.09),500,1,'left');grid(m,x,y+ch*.15,cw*.86,ch*.66,true)}}else if(state.layout===4){text(`${state.year} / ${String(state.month+1).padStart(2,'0')}`,W*.08,H*.31,U*.09,400,1,'left');text(months[state.month],W*.08,H*.42,U*.022,400,.65,'left');const count=days(state.year,state.month),col=W*.84/count,f=Math.min(col*.48,U*.024);ctx.globalAlpha=.2;ctx.fillStyle=state.text;ctx.fillRect(W*.08,H*.54,W*.84,Math.max(1,U*.001));ctx.globalAlpha=1;for(let d=1;d<=count;d++){let x=W*.08+col*(d-.5);text(['日','一','二','三','四','五','六'][new Date(state.year,state.month,d).getDay()],x,H*.59,f*.64,400,.6);text(d,x,H*.64,f);if(state.lunar)text(lunar(state.year,state.month,d),x,H*.69,f*.51,400,.65)}}else if(state.layout===3){text(String(state.month+1).padStart(2,'0'),W*.28,H*.43,U*.36,300);text(`${months[state.month]}  /  ${state.year}`,W*.28,H*.66,U*.022,400,.7);grid(state.month,W*.53,H*.31,W*.36,H*.44)}else{const width=Math.min(W*.50,H*.76),center=state.layout===1?W*.30:state.layout===2?W*.70:W*.5;const safeWidth=Math.min(width,W*.50);text(months[state.month],center,H*.22,U*.041,500);text(`${state.year}  /  ${String(state.month+1).padStart(2,'0')}`,center,H*.29,U*.018,400,.58);grid(state.month,center-safeWidth/2,H*.39,safeWidth,H*.43)}$('monthLabel').textContent=(state.month+1)+' 月';$('year').value=state.year;$('description').textContent=`${state.year} 年${state.layout===5?' · 全年':` ${state.month+1} 月`}  /  ${names[state.layout]}`;$('resolution').textContent=`${W} × ${H} px`;$('color1').value=state.c1;$('color2').value=state.c2;$('textColor').value=state.text;$('color2').hidden=state.bg==='solid';document.querySelectorAll('[data-layout]').forEach(el=>el.classList.toggle('active',Number(el.dataset.layout)===state.layout));document.querySelectorAll('[data-bg]').forEach(el=>el.classList.toggle('active',el.dataset.bg===state.bg));drawPalettes();$('direction').hidden=state.bg==='solid';document.querySelectorAll('[data-direction]').forEach(el=>{el.classList.toggle('active',el.dataset.direction===state.direction);el.setAttribute('aria-pressed',String(el.dataset.direction===state.direction))});document.querySelectorAll('[data-palette]').forEach(el=>el.classList.toggle('active',currentPalettes()[el.dataset.palette].slice(1).join() === [state.c1,state.c2,state.text].join()));}
const drawings=['<rect x="15" y="6" width="16" height="16"/>','<rect x="6" y="6" width="16" height="16"/>','<rect x="24" y="6" width="16" height="16"/>','<text x="6" y="22" fill="currentColor" stroke="none" font-size="23">09</text><path d="M30 12h10m-10 5h10m-10 5h10"/>','<path d="M5 15h36M8 11v8m6-8v8m6-8v8m6-8v8m6-8v8m6-8v8"/>','<path d="M7 6h6m5 0h6m5 0h6M7 12h6m5 0h6m5 0h6M7 18h6m5 0h6m5 0h6M7 24h6m5 0h6m5 0h6"/>'];
$('layouts').innerHTML=names.map((n,i)=>`<button class="layout" data-layout="${i}"><svg viewBox="0 0 46 28" fill="none" stroke="currentColor" stroke-width="1.3">${drawings[i]}</svg>${n}</button>`).join('');
function setPalette(i){[state.c1,state.c2,state.text]=currentPalettes()[i].slice(1)}

function populate(){ $('download').disabled=false;$('sizeHint').textContent='按原始分辨率导出 PNG';$('sizes').innerHTML=sizes[state.device].map(s=>`<option value="${s.join(',')}">${s[0]} × ${s[1]}</option>`).join('');[state.w,state.h]=sizes[state.device][0];}
$('layouts').onclick=e=>{const el=e.target.closest('[data-layout]');if(el){state.layout=+el.dataset.layout;render()}};
$('palette').onclick=e=>{const el=e.target.closest('[data-palette]');if(el){setPalette(+el.dataset.palette);render()}};
function shift(n){const date=new Date(state.year,state.month+n,1);if(date.getFullYear()<1901||date.getFullYear()>2099)return;state.year=date.getFullYear();state.month=date.getMonth();render()}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('year').onchange=e=>{const y=Number(e.target.value);if(Number.isInteger(y)&&y>=1901&&y<=2099)state.year=y;render()};
$('devices').onclick=e=>{if(!e.target.dataset.device)return;state.device=e.target.dataset.device;document.querySelectorAll('[data-device]').forEach(el=>el.classList.toggle('active',el.dataset.device===state.device));$('custom').hidden=state.device!=='custom';$('sizes').hidden=state.device==='custom';if(state.device==='custom'){customSize()}else{populate();render()}};
$('sizes').onchange=e=>{[state.w,state.h]=e.target.value.split(',').map(Number);render()};
function customSize(){const w=Number($('width').value),h=Number($('height').value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<640||w>7680||h<480||h>4320){$('sizeHint').textContent='宽度 640–7680，高度 480–4320，请输入整数。';$('download').disabled=true;return}$('sizeHint').textContent='按原始分辨率导出 PNG';$('download').disabled=false;state.w=w;state.h=h;render()}
$('width').onchange=customSize;$('height').onchange=customSize;
$('background').onclick=e=>{if(e.target.dataset.bg){state.bg=e.target.dataset.bg;setPalette(0);render()}};
$('direction').onclick=e=>{if(e.target.dataset.direction){state.direction=e.target.dataset.direction;render()}};
[['color1','c1'],['color2','c2'],['textColor','text']].forEach(([id,key])=>$(id).oninput=e=>{state[key]=e.target.value;render()});
['monday','lunar'].forEach(key=>$(key).onchange=e=>{state[key]=e.target.checked;render()});$('spacing').oninput=e=>{state.spacing=e.target.value/100;render()};
function randomPalette(){const palettes=currentPalettes(),current=palettes.findIndex(p=>p[1]===state.c1&&p[2]===state.c2);setPalette((Math.max(current,0)+1+Math.floor(Math.random()*(palettes.length-1)))%palettes.length)}
$('randomColor').onclick=()=>{randomPalette();render()};$('random').onclick=()=>{state.bg=Math.random()<.35?'solid':'gradient';randomPalette();state.layout=(state.layout+1+Math.floor(Math.random()*5))%6;render()};
$('download').onclick=()=>{const button=$('download');button.disabled=true;$('status').textContent='正在生成原尺寸壁纸…';const filename=`calendar-${state.year}-${state.layout===5?'year':String(state.month+1).padStart(2,'0')}-${state.w}x${state.h}.png`;try{canvas.toBlob(blob=>{button.disabled=false;if(!blob){$('status').textContent='生成失败，请减小尺寸后重试。';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='壁纸已生成，下载已开始。'},'image/png')}catch(e){button.disabled=false;$('status').textContent='下载失败，请减小尺寸后重试。'}};
populate();render();
</script></body></html>
